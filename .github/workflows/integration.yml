name: Integration

on:
 push:
   branches: [main, master]
 pull_request:
   branches: [main, master]
   types: [opened, reopened, synchronize]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: go-mongo-cdc-elasticsearch
          fetch-depth: 1

      - name: Checkout go-mongo-cdc (dependency)
        uses: actions/checkout@v4
        with:
          repository: Trendyol/go-mongo-cdc
          path: go-mongo-cdc
          fetch-depth: 1
          token: ${{ secrets.GH_PAT }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'

      - name: Configure Git for private repos
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Set Go private modules
        run: |
          go env -w GOPRIVATE=github.com/Trendyol/*
          go env -w GONOPROXY=github.com/Trendyol/*
          go env -w GONOSUMDB=github.com/Trendyol/*

      - name: Install dependencies
        working-directory: go-mongo-cdc-elasticsearch
        run: |
          go mod tidy
          go mod download
          cd test/integration && go mod tidy && go mod download
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Run Integration Tests
        working-directory: go-mongo-cdc-elasticsearch
        run: make test-integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
